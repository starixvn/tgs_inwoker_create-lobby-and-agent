stages:
 - deploy
 
variables:
  namespace: staging
  type: lobby-or-agent
  lobby: lobby-t1
  agent: agent-t1
  image: lobby-t1
  lang: en-US
  domain: stg-gpi3.rpgp.cc
  token: ooooxxxxx
  site: https"//stg-t1.rpgp.cc/

build-job:
  stage: deploy
  before_script:
    export PATH=$PATH:/usr/local/hub-tool 
  script:
    - | 
      hub-tool repo ls
      image=$(hub-tool tag ls pgtgs/${image}  | grep -v inactive | awk '{print $1}' | sed -n 2p)
      echo "image=${image}"

      envsubst < ${type}-${namespace}.yaml 
      envsubst < ${type}-${namespace}.yaml  | kubectl apply -f -