stage:
 - deploy
 
variables:
  namespace:
  lobby:
  agent:
  image:
  lang: 
  domain:
  token: 
  site:

build-job:
  stage: deploy
  before_script:
    export PATH=$PATH:/usr/local/hub-tool 
  script:
    - | 
      hub-tool repo ls
      image=$(hub-tool tag ls pgtgs/${image}  | grep -v inactive | awk '{print $1}' | sed -n 2p)
      echo "image=${image}"

      envsubst < agent-${namespace}.yaml 
      envsubst < agent-${namespace}.yaml  | kubectl apply -f -